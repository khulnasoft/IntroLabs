name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  GOFLAGS: "-mod=readonly"

jobs:
  lint-and-vet:
    name: Lint & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: true

      - name: Run go vet
        run: go vet ./...

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: true

      - name: Run unit tests
        run: go test ./internal/...

  template-validation:
    name: Validate Built-in Templates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: true

      - name: Build labctl
        run: go build -o /tmp/labctl ./cmd/labctl

      - name: Validate all built-in templates
        run: |
          set -e
          for t in templates/*/*/; do
            echo "=== Validating $t ==="
            /tmp/labctl validate "$t"
          done

  package-creation:
    name: Template Packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: true

      - name: Build labctl
        run: go build -o /tmp/labctl ./cmd/labctl

      - name: Package intro-lab template
        run: |
          cd "$GITHUB_WORKSPACE"
          /tmp/labctl package "$GITHUB_WORKSPACE/templates/web/intro-lab"
          ls -la "$GITHUB_WORKSPACE"/labkit-web-intro-lab-*.tar.gz

      - name: Verify package checksum
        run: |
          cd "$GITHUB_WORKSPACE"
          archive=$(ls labkit-web-intro-lab-*.tar.gz | head -1)
          checksum_file=$(ls labkit-web-intro-lab-*.sha256 | head -1)
          expected=$(awk '{print $1}' "$checksum_file")
          actual=$(sha256sum "$archive" | awk '{print $1}')
          if [ "$expected" != "$actual" ]; then
            echo "Checksum mismatch: expected $expected, got $actual"
            exit 1
          fi
          echo "Checksum verified: $actual"

  integration-tests:
    name: Integration Tests (Docker)
    runs-on: ubuntu-latest
    needs: [lint-and-vet, unit-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: true

      - name: Check Docker availability
        run: |
          docker info > /dev/null 2>&1 || { echo "Docker not available"; exit 1; }

      - name: Run integration tests
        run: |
          go test -tags=integration -v -timeout 300s ./tests/... | tee /tmp/integration-output.txt || {
            echo "=== Integration test diagnostics ==="
            cat /tmp/integration-output.txt
            docker ps -a || true
            exit 1
          }

      - name: Capture diagnostics on failure
        if: failure()
        run: |
          echo "=== Docker containers ==="
          docker ps -a || true
          echo "=== Docker volumes ==="
          docker volume ls || true

  cleanup-verification:
    name: Verify Cleanup (No Leftover Instances)
    runs-on: ubuntu-latest
    needs: [integration-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: true

      - name: Build labctl
        run: go build -o /tmp/labctl ./cmd/labctl

      - name: Verify no lingering labkit containers
        run: |
          running=$(docker ps -q --filter "name=labkit-" || true)
          if [ -n "$running" ]; then
            echo "Found lingering labkit containers: $running"
            docker ps -a --filter "name=labkit-"
            exit 1
          fi
          echo "No lingering labkit containers found."
