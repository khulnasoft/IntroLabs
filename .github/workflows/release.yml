name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'

    - name: Build labctl
      run: |
        GOOS=linux GOARCH=amd64 go build -o labctl-linux-amd64 ./cmd/labctl
        GOOS=darwin GOARCH=amd64 go build -o labctl-darwin-amd64 ./cmd/labctl
        GOOS=darwin GOARCH=arm64 go build -o labctl-darwin-arm64 ./cmd/labctl
        GOOS=windows GOARCH=amd64 go build -o labctl-windows-amd64.exe ./cmd/labctl

    - name: Create release archive
      run: |
        tar -czf labctl-linux-amd64.tar.gz labctl-linux-amd64
        tar -czf labctl-darwin-amd64.tar.gz labctl-darwin-amd64
        tar -czf labctl-darwin-arm64.tar.gz labctl-darwin-arm64
        zip labctl-windows-amd64.zip labctl-windows-amd64.exe

    - name: Calculate checksums
      run: |
        sha256sum labctl-*.tar.gz labctl-*.zip > checksums.txt

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          labctl-linux-amd64.tar.gz
          labctl-darwin-amd64.tar.gz
          labctl-darwin-arm64.tar.gz
          labctl-windows-amd64.zip
          checksums.txt
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
